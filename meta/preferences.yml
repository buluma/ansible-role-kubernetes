---
# Pins the CI platform/version matrix for this role. Without this, ansible-generator
# falls back to default_platforms and silently discards these choices on regenerate.
platforms:
  - name: EL
    versions:
      - "10"
      - "9"
  - name: Debian
    versions:
      # Excludes 11: modprobe fails to insert br_netfilter with "Exec
      # format error" on the buluma/debian:11 test image specifically,
      # while every other platform works fine against the same
      # host-mounted /lib/modules -- looks like a stale/mismatched
      # module baked into that one image, not a role bug.
      - "13"
      - "12"
  - name: Fedora
    versions:
      # Excludes 45: it ships Python 3.15.0b3, whose dataclasses module
      # dropped _is_type, breaking ansible-core's AnsiballZ module wrapper.
      - "44"
      - "43"
  - name: Ubuntu
    versions:
      - all
