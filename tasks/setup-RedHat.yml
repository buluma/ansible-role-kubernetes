---
- name: setup-RedHat | Ensure Kubernetes repository exists.
  ansible.builtin.yum_repository:
    name: kubernetes
    description: Kubernetes
    enabled: true
    gpgcheck: "{{ kubernetes_yum_gpg_check }}"
    repo_gpgcheck: "{{ kubernetes_yum_repo_gpg_check }}"
    baseurl: "{{ kubernetes_yum_base_url }}"
    gpgkey: "{{ kubernetes_yum_gpg_key }}"

- name: setup-RedHat | Add Kubernetes GPG keys.
  ansible.builtin.rpm_key:
    key: "{{ item }}"
    state: present
  register: kubernetes_rpm_key
  with_items: "{{ kubernetes_yum_gpg_key }}"
  notify: Refresh Kubernetes dnf cache

- name: setup-RedHat | Flush handlers
  ansible.builtin.meta: flush_handlers
